<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Table Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                        url('https://images.unsplash.com/photo-1497864149936-d3163f0c0f4b?ixlib=rb-1.2.1') center/cover fixed;
            min-height: 100vh;
            padding: 2rem;
            color: white;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 2rem;
            overflow-x: auto;
            backdrop-filter: blur(10px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 1.2rem 1.5rem;
            text-align: left;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        th:hover {
            background: rgba(255,255,255,0.2);
        }

        th i {
            margin-left: 8px;
            opacity: 0.8;
        }

        tbody tr {
            border-bottom: 1px solid rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(245, 245, 245, 0.9);
            transform: translateX(8px);
        }

        td {
            padding: 1.2rem 1.5rem;
            color: #333;
        }

        .status {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .status.active {
            background: linear-gradient(145deg, #c6f6d5, #a8e6bf);
            color: #2b641e;
        }

        .status.pending {
            background: linear-gradient(145deg, #fed7d7, #feb2b2);
            color: #9b2c2c;
        }

        .status.completed {
            background: linear-gradient(145deg, #bee3f8, #9ac9f1);
            color: #2c5282;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .table-container {
                padding: 1rem;
                backdrop-filter: blur(5px);
            }
            
            th, td {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name <i class="fas fa-sort"></i></th>
                    <th>Email <i class="fas fa-sort"></i></th>
                    <th>Role <i class="fas fa-sort"></i></th>
                    <th>Status <i class="fas fa-sort"></i></th>
                    <th>Join Date <i class="fas fa-sort"></i></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>John Doe</td>
                    <td>john@example.com</td>
                    <td>Developer</td>
                    <td><span class="status active">Active</span></td>
                    <td>2023-01-15</td>
                </tr>
                <tr>
                    <td>Jane Smith</td>
                    <td>jane@example.com</td>
                    <td>Designer</td>
                    <td><span class="status pending">Pending</span></td>
                    <td>2023-02-20</td>
                </tr>
                <tr>
                    <td>Mike Johnson</td>
                    <td>mike@example.com</td>
                    <td>Manager</td>
                    <td><span class="status completed">Completed</span></td>
                    <td>2023-03-10</td>
                </tr>
                <tr>
                    <td>Sarah Wilson</td>
                    <td>sarah@example.com</td>
                    <td>Developer</td>
                    <td><span class="status active">Active</span></td>
                    <td>2023-04-05</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Add sorting functionality
        document.querySelectorAll('th').forEach(headerCell => {
            headerCell.addEventListener('click', () => {
                const table = headerCell.closest('table');
                const columnIndex = Array.from(headerCell.parentElement.children).indexOf(headerCell);
                const rows = Array.from(table.querySelectorAll('tbody tr'));
                const isAscending = headerCell.classList.toggle('asc');
                
                rows.sort((a, b) => {
                    const aValue = a.children[columnIndex].textContent;
                    const bValue = b.children[columnIndex].textContent;
                    
                    // Handle numeric values
                    if (!isNaN(aValue) && !isNaN(bValue)) {
                        return isAscending ? aValue - bValue : bValue - aValue;
                    }
                    
                    return isAscending 
                        ? aValue.localeCompare(bValue)
                        : bValue.localeCompare(aValue);
                });

                // Remove existing rows
                table.querySelector('tbody').innerHTML = '';
                
                // Re-add sorted rows
                rows.forEach(row => table.querySelector('tbody').appendChild(row));
                
                // Update sort indicators
                table.querySelectorAll('th i').forEach(icon => {
                    icon.className = 'fas fa-sort';
                });
                headerCell.querySelector('i').className = `fas fa-sort-${isAscending ? 'up' : 'down'}`;
            });
        });
    </script>
</body>
</html>
